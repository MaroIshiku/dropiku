name: ishiku upstream discovery

on:
  schedule:
    - cron: '0 5 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate declared upstream policy
        run: node .ishiku/kit/scripts/check-dependencies .
      - name: Publish discovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-discovery-${{ github.run_id }}
          path: .ishiku/reports/
          retention-days: 30

# Dependency and generated-upstream changes are opened by each project's
# declared updater command. High-risk updates require review and never auto-merge.
